    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background-color: #E2001A; padding: 10px; }
        
        /* CABEÇALHO GIGANTE */
        .header { text-align: center; padding: 20px 0; color: white; }
        .logo-gigante { font-size: 75px; font-weight: 900; letter-spacing: -5px; line-height: 1; margin: 0; text-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
        .tag-amarela { background: #FFD700; color: #E2001A; padding: 8px 20px; border-radius: 50px; font-weight: 900; display: inline-block; transform: rotate(-2deg); box-shadow: 3px 3px 0px #000; margin-top: 10px; }

        /* BOX DE PREÇO E FREEZER */
        .box-destaque { background: #000; border: 3px solid #FFD700; border-radius: 20px; margin: 15px 0; padding: 20px; text-align: center; color: white; }
        .preço-valor { font-size: 55px; font-weight: 900; color: white; display: block; }
        .freezer-alerta { color: #FFD700; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }

        /* CARD DE CADASTRO */
        .card-branco { background: white; border-radius: 30px; padding: 25px; color: #333; box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .titulo-form { text-align: center; font-weight: 900; margin-bottom: 20px; color: #E2001A; font-size: 18px; text-transform: uppercase; }
        
        .campo { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #777; margin-bottom: 5px; text-transform: uppercase; font-family: sans-serif; }
        input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 12px; font-size: 15px; outline: none; font-family: sans-serif; font-weight: bold; }
        input:focus { border-color: #E2001A; background: #fffcfc; }

        /* BOTÃO DE AÇÃO */
        .btn-enviar { width: 100%; padding: 22px; background: #E2001A; color: white; border: none; border-radius: 100px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: 0.3s; text-transform: uppercase; }
        .btn-enviar:hover { transform: scale(1.02); background: #c10016; }

        .footer { text-align: center; font-size: 10px; color: rgba(255,255,255,0.8); margin-top: 25px; font-family: sans-serif; }
    </style>
</head>
