<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibon Atacado - Promoção Ki Loucura</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kibon-red: #E2001A;
            --kibon-yellow: #FFD700;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: #d10016;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .main-card {
            background-color: var(--kibon-red);
            width: 100%;
            max-width: 500px;
            border-radius: 40px;
            border: 5px solid var(--white);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            overflow: hidden;
            color: var(--white);
        }

        /* CABEÇALHO COM NOME GIGANTE */
        .header-promo {
            text-align: center;
            padding: 30px 20px 10px;
        }

        .promo-ki {
            font-size: 18px;
            color: var(--white);
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: -5px;
        }

        .nome-kibon-grande {
            font-family: 'Montserrat', sans-serif;
            font-size: 75px; /* NOME GIGANTE */
            font-weight: 900;
            color: var(--white);
            letter-spacing: -4px;
            line-height: 1;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .tag-loucura {
            display: inline-block;
            background: var(--kibon-yellow);
            color: var(--kibon-red);
            padding: 5px 20px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 20px;
            transform: rotate(-3deg);
            box-shadow: 3px 3px 0px #000;
        }

        /* AREA DE PREÇO ATACADO */
        .price-container {
            background: #000;
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid var(--kibon-yellow);
            text-align: center;
        }

        .price-label { font-size: 12px; color: var(--kibon-yellow); font-weight: 700; letter-spacing: 1px; }
        .price-value { font-size: 55px; font-weight: 900; display: block; margin: 5px 0; }
        .price-bonus { color: #28a745; font-size: 12px; font-weight: 700; }

        /* FORMULÁRIO */
        .form-area {
            background: #fff;
            padding: 25px;
            color: #333;
        }

        .form-title {
            text-align: center;
            font-weight: 800;
            color: var(--kibon-red);
            margin-bottom: 20px;
            font-size: 16px;
        }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 800; color: #666; margin-bottom: 4px; text-transform: uppercase; }
