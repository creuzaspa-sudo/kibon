<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibon - Portal do Revendedor</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kibon-red: #E2001A; --kibon-yellow: #FFD700; --dark: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #fdfdfd; color: var(--dark); line-height: 1.6; }
        
        /* Header Profissional */
        header { background: var(--kibon-red); padding: 40px 20px; text-align: center; border-bottom: 6px solid var(--kibon-yellow); color: white; }
        .logo { font-size: 55px; font-weight: 900; letter-spacing: -3px; display: block; line-height: 1; }
        .promo-badge { background: white; color: var(--kibon-red); display: inline-block; padding: 5px 15px; border-radius: 50px; font-weight: 800; font-size: 12px; margin-top: 10px; text-transform: uppercase; }

        .hero-box { max-width: 500px; margin: -20px auto 20px; background: var(--dark); color: white; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .hero-box h2 { font-size: 14px; color: var(--kibon-yellow); text-transform: uppercase; letter-spacing: 1px; }
        .price { font-size: 48px; font-weight: 900; display: block; margin: 5px 0; }
        .benefit { font-size: 13px; font-weight: 700; border-top: 1px solid #333; padding-top: 10px; color: #00ff88; }

        /* Formulário de Alta Conversão */
        .form-container { max-width: 500px; margin: 0 auto 40px; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 25px; border: 1px solid #eee; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #999; margin-bottom: 6px; text-transform: uppercase; }

        input:focus { border-color: var(--kibon-red); background: #fffcfc; }
