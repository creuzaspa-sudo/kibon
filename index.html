<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parceiro Kibon - Cadastro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kibon-red: #e2001a;
            --kibon-dark: #b80015;
            --bg-light: #fdfdfd;
            --text-gray: #444;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: #f0f2f5;
            background-image: radial-gradient(circle at 2px 2px, #ddd 1px, transparent 0);
            background-size: 40px 40px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            border-top: 8px solid var(--kibon-red);
        }

        .header {
            background: #fff;
            padding: 40px 20px 20px;
            text-align: center;
        }

        .header img {
            width: 130px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 22px;
            color: var(--kibon-red);
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-body { padding: 30px; }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 8px;
            padding-left: 5px;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            background: #fcfcfc;
        }

        input:focus, select:focus {
            border-color: var(--kibon-red);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(226, 0, 26, 0.1);
        }

        .btn-send {
            width: 100%;
            padding: 16px;
            background: var(--kibon-red);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-send:hover {
            background: var(--kibon-dark);
            transform: translateY(-2px);
        }

        .btn-send:active { transform: translateY(0); }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
            background: #fafafa;
        }

        /* Ícone de WhatsApp simulado */
        .btn-send::after {
            content: '→';
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img src="https://logodownload.org/wp-content/uploads/2017/05/kibon-logo-1.png" alt="Kibon">
        <h1>Portal de Credenciamento</h1>
    </div>

    <form class="form-body" id="regForm">
        <div class="input-group">
            <label>Sua Cidade</label>
            <input type="text" id="cidade" placeholder="Ex: São Paulo
